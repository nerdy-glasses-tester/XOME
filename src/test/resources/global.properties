# ---------------- Mobile Device Settings ----------------
# Specify the mobile platform: Android or iOS
mobiledevice=Android

# Run on a real device? yes/no
runonrealdevice=yes

# Specify simulator/emulator type if not running on real device
# Options: Android or iOS simulator (leave empty if using real device)
simulator=Android

# Reset options: fullReset, fastReset, or noReset
# resetType=fullReset

# ---------------- App Paths ----------------
# Folder containing APK for Android real device
apkfile=/Users/geeky/eclipse-workspace/XOME/src/test/resources

# Folder containing IPA for iOS real device
iosappfile=/Users/geeky/eclipse-workspace/XOME/src/test/resources

# Folder containing simulator Android APK (optional, used if simulator=Android)
simulatormacandroidappfile=/Users/geeky/eclipse-workspace/XOME/src/test/resources

# Folder containing simulator iOS app (optional, used if simulator=iOS)
simulatormaciosappfile=/Users/geeky/eclipse-workspace/XOME/src/test/resources

# ---------------- Real Device IDs ----------------
# Android real device serial number (from 'adb devices')
androidDeviceId=ecbfd827b282a9dc

# iOS real device UDID (from 'idevice_id -l' or Xcode)
iosDeviceUdid=8319807bbbc1d04c9bbc0634e14d28aca946b536

# ---------------- Web Settings ----------------
# Enable web automation? yes/no
webautomation=yes

# Enable mobile automation? yes/no
mobileautomation=no

# Browser to use for web automation (chrome, firefox, safari, microsoftedge)
webbrowser=chrome

# Web URL to test
weburl=https://www.xome.com

# ---------------- Optional Driver Paths ----------------
# ChromeDriver paths
macchromedriver=/Users/geeky/drivers/chromedriver
pcchromedriver=C:\\drivers\\chromedriver.exe

# GeckoDriver paths (Firefox)
macgeckodriver=/Users/geeky/drivers/geckodriver
pcgeckodriver=C:\\drivers\\geckodriver.exe

# EdgeDriver path
edgedriver=/Users/geeky/drivers/msedgedriver
